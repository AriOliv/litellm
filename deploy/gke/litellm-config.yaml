litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: True
  num_retries: 3
  request_timeout: 600
  telemetry: False
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Audit logs — tracks create/update/delete on keys, teams, users, models, etc.
  # Persisted in LiteLLM_AuditLog table. Enterprise feature.
  store_audit_logs: true

router_settings:
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  # `anthropic-*` aliases expose non-Claude chat models to clients that only
  # surface models whose id begins with "claude"/"anthropic" (e.g. Claude Code's
  # /model gateway discovery). They route to the real model group, so no
  # provider credentials are duplicated. Non-chat models (transcription,
  # embedding, image, video) are intentionally not aliased.
  model_group_alias:
    "claude-haiku-4-5-20251001": "claude-haiku-4-5"
    "claude-g.p.t-6": "gpt-6"
    "claude-g.p.t-5.5": "gpt-5.5"
    "claude-g.p.t-5.6-sol": "gpt-5.6-sol"
    "claude-g.p.t-5.6-terra": "gpt-5.6-terra"
    "claude-g.p.t-5.6-luna": "gpt-5.6-luna"
    "claude-g.p.t-5.4-pro": "gpt-5.4-pro"
    "claude-g.p.t-5.3": "gpt-5.3-chat"
    "claude-g.p.t-5.2": "gpt-5.2-chat"
    "claude-g.p.t-5.1": "gpt-5.1-chat"
    "claude-g.p.t-oss-120b": "gpt-oss-120b"
    "claude-g.p.t-oss-20b": "gpt-oss-20b"
    "claude-model-router": "model-router"
    "claude-g.rok-4.3": "grok-4.3"
    "claude-g.rok-4.1-fast": "grok-4-1-fast-reasoning"
    "claude-k.imi-k2-6": "Kimi-K2.6"
    "claude-k.imi-k2-7-code": "Kimi-K2.7-Code"
    "claude-deep-seek-v4-pro": "DeepSeek-V4-Pro"
    "claude-deep-seek-v4-flash": "DeepSeek-V4-Flash"
