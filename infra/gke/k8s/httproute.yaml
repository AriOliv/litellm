apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ${APP_NAMESPACE}
spec:
  parentRefs:
    - name: litellm
  hostnames:
    - ${GATEWAY_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 80
