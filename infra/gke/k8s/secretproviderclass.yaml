# Secret Manager CSI driver: pulls each secret from GCP Secret Manager and syncs a k8s Secret
# named litellm-secrets, which the Deployment consumes via envFrom. Add one `objects` entry and one
# `secretObjects.data` entry per secret loaded in Phase 2 (master key, each provider key, the OAuth
# client secret, Langfuse keys, and the composed DATABASE_URL). Only a representative subset is
# shown; extend it to cover the full .env.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: litellm-secrets
  namespace: ${APP_NAMESPACE}
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/${PROJECT_ID}/secrets/litellm-master-key/versions/latest"
        path: "litellm-master-key"
      - resourceName: "projects/${PROJECT_ID}/secrets/litellm-database-url/versions/latest"
        path: "litellm-database-url"
      - resourceName: "projects/${PROJECT_ID}/secrets/anthropic-api-key/versions/latest"
        path: "anthropic-api-key"
      - resourceName: "projects/${PROJECT_ID}/secrets/openrouter-api-key/versions/latest"
        path: "openrouter-api-key"
      - resourceName: "projects/${PROJECT_ID}/secrets/gemini-api-key/versions/latest"
        path: "gemini-api-key"
      - resourceName: "projects/${PROJECT_ID}/secrets/groq-api-key/versions/latest"
        path: "groq-api-key"
      - resourceName: "projects/${PROJECT_ID}/secrets/google-client-id/versions/latest"
        path: "google-client-id"
      - resourceName: "projects/${PROJECT_ID}/secrets/google-client-secret/versions/latest"
        path: "google-client-secret"
      - resourceName: "projects/${PROJECT_ID}/secrets/langfuse-public-key/versions/latest"
        path: "langfuse-public-key"
      - resourceName: "projects/${PROJECT_ID}/secrets/langfuse-secret-key/versions/latest"
        path: "langfuse-secret-key"
  secretObjects:
    - secretName: litellm-secrets
      type: Opaque
      data:
        - objectName: "litellm-master-key"
          key: LITELLM_MASTER_KEY
        - objectName: "litellm-database-url"
          key: DATABASE_URL
        - objectName: "anthropic-api-key"
          key: ANTHROPIC_API_KEY
        - objectName: "openrouter-api-key"
          key: OPENROUTER_API_KEY
        - objectName: "gemini-api-key"
          key: GEMINI_API_KEY
        - objectName: "groq-api-key"
          key: GROQ_API_KEY
        - objectName: "google-client-id"
          key: GOOGLE_CLIENT_ID
        - objectName: "google-client-secret"
          key: GOOGLE_CLIENT_SECRET
        - objectName: "langfuse-public-key"
          key: LANGFUSE_PUBLIC_KEY
        - objectName: "langfuse-secret-key"
          key: LANGFUSE_SECRET_KEY
