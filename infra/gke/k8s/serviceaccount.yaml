apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${GATEWAY_KSA}
  namespace: ${APP_NAMESPACE}
  annotations:
    # Bind to the Google service account created by Terraform (Workload Identity):
    # roles/cloudsql.client + roles/secretmanager.secretAccessor.
    iam.gke.io/gcp-service-account: ${GSA_EMAIL}
